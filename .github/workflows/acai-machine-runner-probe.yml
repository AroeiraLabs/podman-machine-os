name: Acai P4-3A runner probe

# Probe único, manual e fail-closed do build AppleHV/arm64 com source-lock.
# Gate: AroeiraLabs/acai docs/security/PODMAN-MACHINE-P4-3A-SOURCE-LOCK-GATE.md
# Runner ubuntu-24.04-arm e dispatch autorizados por Alan Leite (issue #41).
# Sem secrets, cache, artefato, login, atestação ou publicação.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acai-p4-3a-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Locked AppleHV/arm64 build (no publication)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      # Mesma imagem FCOS pinada do build (filho linux/arm64 do lock).
      # Digests do canal quay.io/fedora/fedora:44 provaram-se não-duráveis
      # (retag diário + GC) — evidência no parecer do PR #2.
      image: quay.io/fedora/fedora-coreos@sha256:4273f06f799e1a114c57ed42eaa8295cc586f1c5860256b1b89c3b3c7cf5b1a6
      options: --privileged -v /dev:/dev -v /lib/modules:/lib/modules -v /var --tmpfs /run --tmpfs /tmp
    steps:
      - name: Checkout da main aprovada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Teste estático do lock (fail-closed)
        shell: bash
        run: bash acai/test-lock-static.sh

      - name: Toolchain presa ao snapshot GA verificado
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          rm -f /etc/yum.repos.d/*.repo
          cat > /etc/yum.repos.d/acai-f44-ga-locked.repo <<'ACAIREPO'
          [acai-f44-ga-locked]
          name=Fedora 44 GA (locked)
          baseurl=https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/aarch64/os/
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-44-primary
          metadata_expire=never
          ACAIREPO
          dnf makecache --refresh
          ACAI_REPOMD="$(find /var/cache -path '*acai-f44-ga-locked*' -name repomd.xml | head -1)"
          echo "ad124f8125666e9059d7a8180427bdaea80f6286f71140457e5c7edd95883eee  ${ACAI_REPOMD}" | sha256sum -c -
          test "$(dnf repolist --enabled | grep -c acai-f44-ga-locked)" -ge 1
          # Lista idêntica a toolchain_packages do acai/lock.json (revisada em PR)
          dnf install -y --disablerepo='*' --enablerepo=acai-f44-ga-locked \
            git curl podman buildah zstd osbuild osbuild-tools \
            osbuild-ostree rpm-ostree xfsprogs e2fsprogs jq dosfstools \
            util-linux-core
          echo "::notice::toolchain instalada do snapshot verificado; manifesto no relatório final"

      - name: Verificação do source-lock (fail-closed)
        shell: bash
        run: bash acai/verify-lock.sh

      - name: Build travado AppleHV/arm64 (sem publicação)
        shell: bash
        run: bash acai/build-applehv.sh

      - name: Relatório sanitizado e limpeza incondicional
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "workflow_sha=${GITHUB_SHA}"
          echo "runner_arch=$(uname -m) label=ubuntu-24.04-arm"
          echo "lock_sha256=$(sha256sum acai/lock.json | cut -d' ' -f1)"
          echo "toolchain (rpm -qa, registro):"
          rpm -qa --qf '%{NEVRA}\n' 2>/dev/null | sort | tail -60 || true
          rm -rf /var/tmp/acai || true
          echo "workspace_destruido=confirmado"
          if [ -e "${XDG_RUNTIME_DIR:-/run/user/0}/containers/auth.json" ]; then
            echo "::error::auth.json presente"; exit 42
          fi
          echo "sem_login_registry=confirmado sem_artefato=confirmado sem_atestacao=confirmada"
