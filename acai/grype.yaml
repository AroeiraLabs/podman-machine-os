# Acai P4-3B — regras de exceção do scan de vulnerabilidades.
#
# Contexto: o scan roda DUAS vezes no job. A primeira é informativa e imprime
# TODOS os achados, sem exceção nenhuma — nada fica escondido do relatório. A
# segunda é a que decide (fail-closed) e usa este arquivo.
#
# Única exceção, aprovada por Alan Leite em 2026-07-30 (D-012):
#
#   Achados em módulos Go (`go-module`).
#
# Justificativa: esses módulos são compilados estaticamente para dentro dos
# binários do podman, buildah e afins pelo empacotador upstream. Não existe
# atualização de RPM, nem escolha de versão no nosso lock, que os altere: eles
# só mudam quando o upstream recompila. Manter a regra "zero altas" sobre eles
# não produziria nenhuma ação corretiva possível — apenas impediria qualquer
# publicação, indefinidamente.
#
# Reavaliação: a cada re-pin de release upstream do podman-machine-os. Se o
# rebuild upstream não reduzir os achados, a decisão deve ser revista, não
# renovada por inércia.
#
# Segunda exceção, aprovada por Alan Leite em 2026-07-30 (D-013):
#
#   Pacotes do kernel.
#
# Justificativa: kernels são installonly. Um `dnf upgrade` instala o novo AO
# LADO do que veio da base, e a imagem resultante tem dois kernels; o disco
# gerado arranca no mais novo sem a configuração de boot correspondente e entra
# em kernel panic. Isso não é hipótese: foi reproduzido no primeiro boot do
# digest sha256:cdf90b1b..., com log de console preservado. Trocar o kernel de
# uma imagem bootc exige uma base FCOS nova, composta corretamente.
#
# Ou seja, o achado é real mas a remediação por dnf é pior que o risco: torna a
# imagem inutilizável. A remediação verdadeira é re-pinar a base FCOS, e ela
# não depende deste arquivo.
#
# Risco residual, declarado: o kernel é exatamente o que a base Fedora CoreOS
# entrega e o mesmo que o podman-machine-os upstream distribui — não estamos
# em posição pior que a referência. O guest é efêmero, não monta o /Users do
# host e é destruído por execução.
#
# GATILHO DE REMEDIAÇÃO — esta exceção não deve ser renovada por inércia:
# assim que o Fedora CoreOS publicar um release novo no stream stable, re-pinar
# a base no lock e reconstruir. Na coleta de 2026-07-30 o stable estava em
# 44.20260707.3.1, inalterado desde 21/07.
#
# O que NÃO é exceção: qualquer outro achado em RPM, python ou outro tipo
# continua barrando a publicação. Esses são acionáveis pelo snapshot de updates.
ignore:
  - package:
      type: go-module
  - package:
      name: kernel
  - package:
      name: kernel-core
  - package:
      name: kernel-modules
  - package:
      name: kernel-modules-core
  - package:
      name: kernel-modules-extra
