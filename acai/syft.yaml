# Acai P4-3B — configuração do syft para a SBOM do artefato final.
#
# Objetivo: preservar integralmente a enumeração POR COMPONENTE que o gate
# exige (pacotes, versões e licenças) e remover apenas metadados que nenhum
# controle usa e que respondem pela maior parte do tamanho.
#
# Por que o tamanho importa: 16 MiB não é um número escolhido por nós. É uma
# trava rígida no código da própria action de atestação
# (MAX_SBOM_SIZE_BYTES = 16 * 1024 * 1024 em actions/attest/src/sbom.ts),
# aplicada com fs.stat sobre o arquivo em disco, antes de assinar e antes de
# qualquer push. Não há como contorná-la comprimindo, dividindo ou publicando
# por outro caminho — e o GitHub recusou expressamente um pedido de flag para
# ultrapassá-la (actions/attest#402). O teto do gate está correto: quem tem de
# caber é a SBOM.

# Desliga os catalogadores de arquivo.
file:
  metadata:
    selection: none

# ESTA é a alavanca que realmente pesa. Desligar os catalogadores acima não
# basta: o array "files" do SPDX é construído a partir de AllCoordinates(), que
# inclui as coordenadas extraídas das RELAÇÕES. Com a posse pacote-arquivo
# ligada, cada arquivo pertencente a um pacote continua gerando uma entrada em
# "files" (com sha1 de zeros) e outra em "relationships".
#
# Cuidado registrado: NÃO desligar aqui `package-file-ownership-overlap`. Fazê-lo
# sem também desligar `package.exclude-binary-overlap-by-ownership` é erro fatal
# de validação do syft; e esse segundo já vem ligado por padrão, cumprindo o
# mesmo papel.
relationships:
  package-file-ownership: false
